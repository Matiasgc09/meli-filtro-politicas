services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: postventa
      MARIADB_USER: app
      MARIADB_PASSWORD: ${DB_PASSWORD:-app}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - datos:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: mysql://app:${DB_PASSWORD:-app}@db:3306/postventa
      PUERTO: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos:
